name: Flutter CI

on:
  push:
    branches: [ main, master, work ]
  pull_request:
    branches: [ main, master, work ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres -e POSTGRES_PASSWORD=boteco -e POSTGRES_DB=boteco_pro -p 5432:5432 postgres:15
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/
