name: Flutter CI

on:
  push:
    branches: [odoo-online, stable-v0.1.2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  quality-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reject tracked local credentials
        run: |
          tracked_credentials="$(git ls-files -- .env .env.local '.env.*.local')"
          if [[ -n "$tracked_credentials" ]]; then
            echo "A local environment file is tracked. Remove it before merging."
            echo "$tracked_credentials"
            exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build Web release
        run: flutter build web --release --no-pub

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
