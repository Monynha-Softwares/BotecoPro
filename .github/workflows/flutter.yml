name: Flutter CI

on:
  push:
    branches: [feat/odoo-online-mvp]
  pull_request:

defaults:
  run:
    working-directory: .

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reject tracked local credentials
        run: |
          if git ls-files --error-unmatch .env .env.local '.env.*.local' >/dev/null 2>&1; then
            echo "A local environment file is tracked. Remove it before merging."
            exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
