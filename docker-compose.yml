version: '3.8'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boteco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boteco}
      POSTGRES_DB: ${POSTGRES_DB:-boteco_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
