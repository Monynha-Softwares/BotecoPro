openapi: 3.0.3
info:
  title: Boteco Pro API
  version: 1.0.0
paths:
  /rpc/sp_createorder:
    post:
      tags:
      - orders
      summary: Create new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                table_id:
                  type: integer
                employee_id:
                  type: integer
                client_id:
                  type: integer
                notes:
                  type: string
              required:
              - table_id
              - employee_id
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: integer
  /rpc/get_my_orders:
    post:
      tags:
      - public
      summary: List my orders
      operationId: getMyOrders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    order_id:
                      type: integer
                    table_id:
                      type: integer
                    status:
                      type: string
                    order_datetime:
                      type: string
                      format: date-time
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
