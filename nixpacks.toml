[project]
name = "boteco-pro"
providers = []

[phases.setup]
aptPkgs = [
  "ca-certificates",
  "curl",
  "unzip",
  "xz-utils",
  "git",
  "clang",
  "cmake",
  "ninja-build",
  "python3",
  "libgtk-3-0",
  "libglu1-mesa",
  "libstdc++6"
]
commands = [
  "mkdir -p /opt",
  "curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.3-stable.tar.xz -o /tmp/flutter.tar.xz",
  "tar -xJf /tmp/flutter.tar.xz -C /opt",
  "rm /tmp/flutter.tar.xz",
  "ln -sf /opt/flutter/bin/flutter /usr/local/bin/flutter",
  "ln -sf /opt/flutter/bin/dart /usr/local/bin/dart"
]

[phases.install]
commands = [
  "flutter config --no-analytics --enable-web",
  "flutter precache --web",
  "flutter pub get"
]

[phases.build]
commands = [
  "flutter build web --release"
]

[environment]
FLUTTER_HOME = "/opt/flutter"
PUB_CACHE = "/app/.pub-cache"
FLUTTER_WEB_ENVIRONMENT = "production"

[start]
command = "python3 -m http.server --directory build/web ${PORT:-8080}"
