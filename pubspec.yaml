  google_fonts: ^6.3.3
  shared_preferences: ^2.3.2
  path_provider: 2.1.4
  provider: 6.1.2
  http: ^1.2.2
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
