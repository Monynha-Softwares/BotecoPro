name: boteco_pro
description: "Gestão completa para seu bar"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter_animate: ^4.0.0
  flutter_launcher_icons: 0.14.3
  table_calendar: ^3.0.0
  flutter_slidable: ^3.0.0
  flutter_svg: ^2.0.0
  intl: ^0.18.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  fl_chart: 0.68.0
